name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING || 'ad-hoc' }}
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BUILD_NUMBER: ${{ github.run_number }}
      SIGNING_IDENTITY: ${{ vars.RELEASE_SIGNING == 'notarized' && vars.APPLE_SIGNING_IDENTITY || '-' }}
      NOTARY_PROFILE: ${{ vars.RELEASE_SIGNING == 'notarized' && 'vaultssh-ci' || '' }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SIGNING" == 'ad-hoc' || "$RELEASE_SIGNING" == 'notarized' ]] || { echo 'RELEASE_SIGNING must be ad-hoc or notarized.' >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Verify release version and notes
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python3 scripts/release-notes.py "$RELEASE_TAG" --signing "$RELEASE_SIGNING" > release-notes.md
      - name: Security release gate
        run: ./scripts/security-check.sh
      - name: Verify locked CLI runtime
        run: ./scripts/check-cli-runtime.sh
      - name: Test and verify app
        # Tests build an ad-hoc app without using distribution credentials.
        env:
          SIGNING_IDENTITY: '-'
        run: ./scripts/check.sh
      - name: Configure signing and notarization
        if: env.RELEASE_SIGNING == 'notarized'
        env:
          NOTARY_KEYCHAIN: ${{ runner.temp }}/vaultssh-signing/signing.keychain-db
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for name in SIGNING_IDENTITY APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release configuration: $name" >&2; exit 1; }
          done
          [[ "$SIGNING_IDENTITY" == "Developer ID Application: "* ]] || { echo "A Developer ID Application identity is required." >&2; exit 1; }
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/vaultssh-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$SIGNING_DIR/certificate.p12"
          printf '%s' "$APPLE_API_KEY_P8" > "$SIGNING_DIR/AuthKey.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$NOTARY_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$NOTARY_KEYCHAIN"
          security import "$SIGNING_DIR/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -k "$NOTARY_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$NOTARY_KEYCHAIN"
          security list-keychains -d user -s "$NOTARY_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$SIGNING_DIR/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$NOTARY_KEYCHAIN"
          rm -f "$SIGNING_DIR/certificate.p12" "$SIGNING_DIR/AuthKey.p8"
      - name: Package DMG and ZIP
        env:
          NOTARY_KEYCHAIN: ${{ runner.temp }}/vaultssh-signing/signing.keychain-db
        run: ./scripts/package.sh
      - name: Remove signing credentials
        if: always() && env.RELEASE_SIGNING == 'notarized'
        env:
          NOTARY_KEYCHAIN: ${{ runner.temp }}/vaultssh-signing/signing.keychain-db
        run: |
          trap 'rm -rf "$RUNNER_TEMP/vaultssh-signing"' EXIT
          if [[ -f "$NOTARY_KEYCHAIN" ]]; then security delete-keychain "$NOTARY_KEYCHAIN"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Verify checksums
        working-directory: artifacts/dist
        run: sha256sum --check ./*.sha256
      - name: Publish release after uploading all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/dist/*.zip artifacts/dist/*.dmg artifacts/dist/*.sha256 \
            --draft --verify-tag --title "VaultSSH $RELEASE_TAG" --notes-file artifacts/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
