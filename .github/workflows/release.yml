name: Release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Verify release version and notes
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python3 scripts/release-notes.py "$RELEASE_TAG" > release-notes.md
      - name: Security release gate
        run: ./scripts/security-check.sh
      - name: Verify locked CLI runtime
        run: ./scripts/check-cli-runtime.sh
      - name: Test and package
        run: |
          ./scripts/check.sh
          ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: artifacts
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/dist/*.zip artifacts/dist/*.sha256 \
            --draft --verify-tag --title "VaultSSH $RELEASE_TAG" --notes-file artifacts/release-notes.md
